<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Adana Türküsü</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #b30000 0%, #f5f5f5 35%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      background: white;
      margin-top: 40px;
      width: 90%;
      max-width: 420px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #b30000;
      font-size: 28px;
    }

    .audio-box {
      margin: 20px 0;
    }

    audio {
      width: 100%;
      height: 54px;
    }

    .hint {
      font-size: 14px;
      color: #666;
      margin-top: 6px;
    }

    .description {
      margin-top: 24px;
      font-size: 16px;
      line-height: 1.6;
      color: #333;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- İl adı -->
    <h1>Adana</h1>

    <!-- Audio -->
    <div class="audio-box">
      <audio controls>
        <source src="audio/turku.aac" type="audio/aac">
        Tarayıcınız ses dosyasını desteklemiyor.
      </audio>
      <div class="hint">🎧 Dinlemek için ▶️ tuşuna dokunun</div>
    </div>

    <!-- Açıklama alanı -->
    <div class="description">
      Çanakkale Türküsü, Çanakkale Savaşı sırasında yaşanan acıları ve
      cepheye giden gençlerin geride bıraktığı ailelerini anlatır.
      Türk halk müziğinin en hüzünlü ve en anlamlı eserlerinden biridir.
    </div>

    <!-- Alt bilgi -->
    <div class="footer">
      18 Mart Çanakkale Zaferi Anısına
    </div>
  </div>

</body>
</html>
